# Blueprint for Amber — Driving School Solutions voice receptionist
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dss-voice-agent
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    disk:
      name: amber-leads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: XAI_WEBHOOK_SECRET
        sync: false
      - key: GRANT_TRANSFER_NUMBER
        sync: false
      - key: NOTIFY_TO_EMAIL
        sync: false
      - key: NOTIFY_FROM_EMAIL
        value: amber@drivingschoolsolutions.co.uk
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DSS_PHONE_NUMBER
        value: "+442081941993"
      - key: XAI_VOICE
        value: eve
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
